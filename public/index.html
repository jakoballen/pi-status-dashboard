<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Status Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div>
      <h1>Pi Status Dashboard</h1>
      <p>Local status overview for Raspberry Pi services and system health.</p>
    </div>
    <p id="lastUpdated">Last updated: Not yet checked</p>
  </header>

  <main>
    <section id="statusGrid" class="statusGrid" aria-label="System status cards">
      <article class="statusCard">
        <h2>Loading...</h2>
        <p class="statusValue">Checking</p>
        <p class="statusDetail">Waiting for dashboard data</p>
      </article>
    </section>
  </main>
</body>
</html>
